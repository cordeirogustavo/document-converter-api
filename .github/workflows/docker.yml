name: Docker Build and Push

on:
  push:
    branches: [main, master]
    paths:
      - "main.py"
    tags: ["v*.*.*"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  check-version-change:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check_version.outputs.version_changed }}
      api_version: ${{ steps.check_version.outputs.api_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Check API version change
        id: check_version
        run: |
          API_VERSION=$(grep -oP 'version="\K[^"]+' main.py | head -1)
          echo "Current API version: $API_VERSION"

          if git diff --name-only HEAD^ HEAD | grep -q "main.py"; then
            git checkout HEAD^ main.py
            PREVIOUS_VERSION=$(grep -oP 'version="\K[^"]+' main.py | head -1)
            git checkout HEAD main.py
            
            echo "Previous API version: $PREVIOUS_VERSION"
            
            if [ "$API_VERSION" != "$PREVIOUS_VERSION" ]; then
              echo "API version changed from $PREVIOUS_VERSION to $API_VERSION"
              echo "version_changed=true" >> $GITHUB_OUTPUT
            else
              echo "API version unchanged"
              echo "version_changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "API version file not changed in this commit"
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

          echo "api_version=$API_VERSION" >> $GITHUB_OUTPUT

  build-and-push:
    needs: check-version-change
    if: ${{ needs.check-version-change.outputs.version_changed == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/document-converter-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
            latest

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
